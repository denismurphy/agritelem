# XcodeGen spec. Generate the (git-ignored) Xcode project with `xcodegen`.
name: Agritelem
options:
  bundleIdPrefix: io.github.agritelem
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AgritelemKit:
    path: Packages/AgritelemKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Agritelem:
    type: application
    platform: iOS
    sources:
      - App
      - Views
      - ViewModels
      - Resources
    dependencies:
      - package: AgritelemKit
        product: AgritelemKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agritelem
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The development server runs over plain HTTP on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agritelem.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  AgritelemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Agritelem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agritelem.tests

  AgritelemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Agritelem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.agritelem.uitests
        TEST_TARGET_NAME: Agritelem

schemes:
  Agritelem:
    build:
      targets:
        Agritelem: all
        AgritelemTests: [test]
        AgritelemUITests: [test]
    test:
      targets:
        - AgritelemTests
        - AgritelemUITests
