name: ios

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Requires a runner image with Xcode 27 and an iOS 26+ simulator runtime.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: AgritelemKit tests
        run: make ios-test-kit
      - name: App unit and UI tests
        run: make ios-test IOS_DESTINATION="platform=iOS Simulator,name=iPhone 17 Pro"
